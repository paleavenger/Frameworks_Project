{% extends "base.html" %}

{% block title %}
    Ошибка данных — Система управления учебными проектными командами
{% endblock %}

{% block content %}
    <h1 class="text-danger">Ошибка данных</h1>
    <p>{{ error }}</p>
    <p>
        Проверьте файл базы данных db.sqlite3 и наличие миграций Django
        командой <code>python manage.py showmigrations</code>.
    </p>
{% endblock %}
