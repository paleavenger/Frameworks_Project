{% extends "base.html" %}

{% block title %}Изображение проекта — {{ site_name }}{% endblock %}

{% block content %}
    <h1>Изображение проекта</h1>
    <p>«{{ project.title }}»</p>
    <form method="post" enctype="multipart/form-data" class="col-lg-6">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ project.get_absolute_url }}" class="btn btn-outline-secondary">К проекту</a>
    </form>
{% endblock %}
