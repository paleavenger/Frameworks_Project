<article class="card student-card mb-3">
    <div class="card-body">
        <h2 class="card-title h5">
            {{ student.name|default:"Без имени" }}
        </h2>

        <p class="card-text">
            {{ student.specialty|default:"специальность не указана" }}
        </p>

        <p class="card-text">
            {% include "students/includes/team_badge.html" %}
        </p>

        <a href="{% url 'students:detail' student.id %}"
           class="btn btn-primary">
            Подробнее
        </a>
    </div>
</article>
